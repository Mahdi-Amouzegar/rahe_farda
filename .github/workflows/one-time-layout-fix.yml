name: One-time bilingual layout fix

on:
  push:
    branches:
      - v0/layout-permissions-map

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0/layout-permissions-map
          fetch-depth: 0

      - name: Apply semantic bilingual layout corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Rename the misleading physical-position names everywhere in text files.
          replacements = {
              'right-flow-container': 'planner-container',
              'right-flow': 'planner-flow',
          }
          text_exts = {'.html', '.css', '.js', '.json', '.md', '.webmanifest'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in text_exts or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          css_path = Path('public/css/responsive.css')
          css = css_path.read_text(encoding='utf-8')

          # Make the desktop shell coordinate system physical/LTR-independent:
          # grid column 1 is always the physical left column and column 2 the right.
          css = css.replace(
              'grid-template-columns: minmax(360px, 42vw) minmax(0, 1fr);',
              'grid-template-columns: minmax(0, 1fr) clamp(400px, 42vw, 760px);',
              1,
          )
          css = css.replace(
              '            grid-column: 2;\n            min-width: 0;\n            height: 100vh;',
              '            grid-column: 2;\n            grid-row: 1;\n            min-width: 0;\n            height: 100vh;',
              1,
          )

          # Replace the previous language-aware block with one canonical rule set.
          marker = '/* Language-aware desktop columns: the visual placement is intentional. */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'

          css += r'''

/* ═══════════════════════════════════════════════════════════════════════════
   Bilingual desktop layout — semantic roles, physical grid coordinates
   The shell itself is always LTR so CSS Grid column numbers mean physical
   left/right positions. Content direction is applied inside each role.
   ═══════════════════════════════════════════════════════════════════════════ */
@media (min-width: 901px) {
    .app-shell {
        direction: ltr;
        grid-template-columns: minmax(0, 1fr) clamp(400px, 42vw, 760px);
    }

    .app-shell > #panelMap {
        grid-column: 1;
        grid-row: 1;
    }

    .app-shell > .planner-container {
        grid-column: 2;
        grid-row: 1;
        position: relative;
        min-width: 0;
    }

    /* Persian: Map physically left, Planner physically right. */
    html[data-lang="fa"] .app-shell > #panelMap {
        grid-column: 1;
    }

    html[data-lang="fa"] .app-shell > .planner-container {
        grid-column: 2;
    }

    /* English: Planner physically left, Map physically right. */
    html[data-lang="en"] .app-shell > #panelMap {
        grid-column: 2;
    }

    html[data-lang="en"] .app-shell > .planner-container {
        grid-column: 1;
    }

    /* Text/layout direction follows the selected language, not the shell grid. */
    html[data-lang="fa"] .app-shell > .planner-container {
        direction: rtl;
    }

    html[data-lang="en"] .app-shell > .planner-container {
        direction: ltr;
    }

    /* The toggle always sits on the physical edge facing the Map. */
    html[data-lang="fa"] .planner-container > .map-divider-toggle {
        left: 0;
        right: auto;
        transform: translate(-50%, -50%);
    }

    html[data-lang="en"] .planner-container > .map-divider-toggle {
        left: auto;
        right: 0;
        transform: translate(50%, -50%);
    }

    body.map-hidden .planner-container {
        grid-column: 1 / -1 !important;
        width: 100%;
        max-width: none;
        justify-self: stretch;
    }

    body.map-hidden .planner-container > .map-divider-toggle {
        transform: translate(0, -50%);
    }

    /* Task detail follows the Planner side while Map is visible. */
    html[data-lang="fa"] .detail-page {
        left: clamp(400px, 42vw, 760px);
        right: 0;
    }

    html[data-lang="en"] .detail-page {
        left: 0;
        right: clamp(400px, 42vw, 760px);
    }

    body.map-hidden .detail-page {
        left: 0;
        right: 0;
    }
}
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Remove this one-time workflow after applying the fix
        run: rm -f .github/workflows/one-time-layout-fix.yml

      - name: Commit and push corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/css/responsive.css public/css/detail.css public/css/*.css js/*.js .github/workflows/one-time-layout-fix.yml
          git commit -m "fix: make bilingual layout physically swap by role" || exit 0
          git push origin HEAD:v0/layout-permissions-map
